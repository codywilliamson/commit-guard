name: Commitlint
on:
  workflow_call:
    inputs:
      config: { type: string, default: conventional }
      node-version: { type: string, default: '24' }
      pr-mode: { type: string, default: smart }
      ignore-bot-commits: { type: boolean, default: true }
      ignore-merge-commits: { type: boolean, default: true }
      ignore-message-patterns: { type: string, default: '' }
permissions: { contents: read }
jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject unsupported legacy options
        if: inputs.config != 'conventional' || inputs.ignore-bot-commits != true || inputs.ignore-merge-commits != true || inputs.ignore-message-patterns != ''
        run: exit 1
      - uses: codywilliamson/commit-guard@v0.3.1
        with:
          mode: ${{ inputs.pr-mode }}
          token: ${{ github.token }}
